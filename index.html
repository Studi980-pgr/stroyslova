<style>
/* Layout: one narrow column like a field notebook; a sticky action bar at the bottom where the thumb is. */

  --bad: #c2352b;
  --bad-bg: #f8e0dd;
  --level: #e0a100;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --ipa: "Noto Sans", "Lucida Grande", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131a; --card: #17202b; --ink: #e7edf4; --muted: #92a0b2; --line: #2a3542;
    --accent: #5a8ef2; --accent-ink: #0b1220; --tile: #223041; --good: #46c27b; --good-bg: #173527;
    --bad: #f0786c; --bad-bg: #3a1d1b; --level: #f0bf3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131a; --card: #17202b; --ink: #e7edf4; --muted: #92a0b2; --line: #2a3542;
  --accent: #5a8ef2; --accent-ink: #0b1220; --tile: #223041; --good: #46c27b; --good-bg: #173527;
  --bad: #f0786c; --bad-bg: #3a1d1b; --level: #f0bf3a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }

  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

}
.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 14px 0; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ipa { font-family: var(--ipa); color: var(--muted); }

header.top { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.seg { flex: none; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; white-space: nowrap; letter-spacing: 0.02em; text-transform: uppercase; }
.seg { display: inline-flex; background: var(--tile); border-radius: 999px; padding: 3px; }

main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-block: 16px 24px; }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.titleblock { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.titleblock div { padding: 10px 0; }
.titleblock div + div { border-left: 1px solid var(--line); padding-left: 14px; }
.big { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.levels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-items: end; height: 64px; }
.levels .bar { background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; opacity: .85; }
.levels .bar.zero { background: var(--line); }

.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }

.progress { height: 6px; background: var(--tile); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.exhead { display: flex; align-items: center; gap: 10px; }

.iconbtn { width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--tile); flex: none; }

.word { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; overflow-wrap: anywhere; }

.example > div { flex: 1; min-width: 0; }

.options { display: grid; grid-template-columns: 1fr; gap: 10px; }
.opt { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 17px; font-weight: 500; min-height: 54px; }

.gap { display: inline-block; min-width: 70px; border-bottom: 2px solid var(--line); }
.sheet.message .gap { border-bottom-color: var(--line); }
.sheet.message .sheet.message .gap { border-bottom-color: var(--line); }

.answerline { min-height: 58px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; padding-bottom: 8px; }
.slot { font-family: var(--display); font-weight: 700; font-size: 32px; min-width: 18px; text-align: center; line-height: 1.1; }
.slot.empty { color: var(--muted); opacity: .45; }
.slot.space { min-width: 14px; }
.chipline { font-size: 19px; font-weight: 500; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { background: var(--tile); border-radius: 10px; min-width: 46px; min-height: 48px; padding: 0 12px; font-size: 20px; font-weight: 600; transition: transform .1s ease, background .15s ease; }
.tile.letter { font-family: var(--display); font-size: 26px; }
.tile.used { visibility: hidden; }
.tile.wrong { background: var(--bad-bg); color: var(--bad); animation: shake .3s; }

@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.field { display: flex; flex-direction: column; gap: 6px; }
input.typed { width: 100%; font: 600 26px var(--body); padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.hint { font-family: var(--display); font-size: 22px; letter-spacing: 0.25em; color: var(--muted); }

.feedback { border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.feedback.good { background: var(--good-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback b { display: block; }
.feedback .fb-body { flex: 1; min-width: 0; }

.list { display: flex; flex-direction: column; gap: 8px; }
.listitem { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.listitem > div { flex: 1; min-width: 0; }
.listitem .en { font-weight: 600; }
.listitem .ru { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pips { display: inline-flex; gap: 2px; flex: none; }
.pips i { width: 5px; height: 14px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--level); }
.status { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<div class="app" id="app"></div>

<script>
const Engine = (() => {
  const INTERVALS = [0, 1, 2, 4, 7, 14, 30];
  const NEW_PER_SESSION = 3;
  const MAX_REVIEWS = 12;

  const idOf = (w) => w.en.toLowerCase();

  // Day number of the local calendar date — same numbering as the Mac app.
  function today(d = new Date()) {
    return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  function shuffle(items) {
    const a = items.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function shuffledDifferently(items) {
    if (new Set(items).size < 2) return items.slice();
    for (let n = 0; n < 10; n++) {
      const s = shuffle(items);
      if (s.join("\u0001") !== items.join("\u0001")) return s;
    }
    return items.slice().reverse();
  }

  const boxOf = (progress, w) => (progress[idOf(w)] && progress[idOf(w)].box) || 0;
  const dueOf = (progress, w) => (progress[idOf(w)] && progress[idOf(w)].due) || 0;

  function dueWords(words, progress, day = today()) {
    return words.filter((w) => boxOf(progress, w) > 0 && dueOf(progress, w) <= day);
  }
  function newWords(words, progress) {
    return words.filter((w) => boxOf(progress, w) === 0);
  }

  // Exercises a word gets, by how well it is known. Producing the word
  // (spelling, then typing) is in every block: recognising is not remembering.
  function plan(box) {
    const two = (pool) => shuffle(pool).slice(0, 2);
    if (box === 0) return ["intro", "meaning", "listen", "letters", "fillBlank"];
    if (box <= 2) { const p = two(["listen", "toEnglish", "fillBlank", "meaning"]); return [p[0], "letters", p[1]]; }
    if (box <= 4) { const p = two(["fillBlank", "buildSentence", "toEnglish", "listen"]); return [p[0], "typing", p[1]]; }
    const p = two(["dictation", "buildSentence", "fillBlank"]);
    return [p[0], "typing", p[1]];
  }

  const NEEDS_EXAMPLE = ["fillBlank", "buildSentence", "dictation"];
  const hasExamples = (w) => Array.isArray(w.examples) && w.examples.length > 0;

  // Wrong options come first from the words being learnt together: telling
  // RFI from submittal is the real skill, telling it from ADU is not.
  function distractors(word, words, group) {
    const near = (group || []).filter((w) => idOf(w) !== idOf(word));
    const rest = shuffle(words.filter((w) => idOf(w) !== idOf(word) && !near.includes(w)));
    return [...near, ...rest].slice(0, 3);
  }

  function make(kind, word, words, retry = false, group = null) {
    if (!hasExamples(word) && NEEDS_EXAMPLE.includes(kind)) kind = kind === "dictation" ? "listen" : "toEnglish";
    const example = hasExamples(word)
      ? word.examples[Math.floor(Math.random() * word.examples.length)]
      : { en: word.en, ru: word.ru };
    const others = distractors(word, words, group);
    const ex = { kind, word, example, options: [], answer: "", pieces: [], target: [], retry, group: null };
    if (kind === "meaning") {
      ex.options = shuffle([word.ru, ...others.map((o) => o.ru)]);
      ex.answer = word.ru;
    } else if (kind === "listen" || kind === "toEnglish" || kind === "fillBlank") {
      ex.options = shuffle([word.en, ...others.map((o) => o.en)]);
      ex.answer = word.en;
    } else if (kind === "letters") {
      ex.target = [...word.en].filter((c) => c !== " ");
      ex.pieces = shuffledDifferently(ex.target);
    } else if (kind === "buildSentence" || kind === "dictation") {
      ex.target = example.en.split(" ");
      ex.pieces = shuffledDifferently(ex.target);
    } else if (kind === "typing") {
      ex.answer = word.en;
    }
    return ex;
  }

  // Match three English words with their meanings.
  function makePairs(group) {
    return {
      kind: "pairs", word: group[0], group, retry: false,
      left: shuffle(group.map((w) => w.en)), right: shuffle(group.map((w) => w.ru)),
      options: [], answer: "", pieces: [], target: [], example: { en: "", ru: "" },
    };
  }

  // A short message from the site that needs all the words of the group —
  // one example sentence of each, with the word taken out.
  function makeSituation(group) {
    const picks = shuffle(group.filter(hasExamples)).map((w) => {
      const ex = w.examples[Math.floor(Math.random() * w.examples.length)];
      const i = ex.en.toLowerCase().indexOf(w.en.toLowerCase());
      return { word: w, before: ex.en.slice(0, i), after: ex.en.slice(i + w.en.length), en: ex.en, ru: ex.ru };
    }).filter((p) => p.before.length + p.after.length > 0 && p.en.toLowerCase().includes(p.word.en.toLowerCase()));
    if (picks.length < 2) return null;
    const target = picks.map((p) => p.word.en);
    return {
      kind: "situation", word: picks[0].word, group: picks.map((p) => p.word), retry: false,
      segments: picks.map((p) => ({ before: p.before, after: p.after })),
      options: [], answer: "", pieces: shuffledDifferently(target), target,
      example: { en: picks.map((p) => p.en).join(" "), ru: picks.map((p) => p.ru).join(" ") },
    };
  }

  // Groups of at most three, as even as possible: 4 words make 2 + 2 and 5
  // make 3 + 2, so no word is left to train alone without the pairs and the
  // message.
  function balancedGroups(list, max = 3) {
    const n = list.length;
    if (!n) return [];
    const count = Math.ceil(n / max);
    const out = [];
    let i = 0;
    for (let k = 0; k < count; k++) {
      const size = Math.floor(n / count) + (k < n % count ? 1 : 0);
      out.push(list.slice(i, i + size));
      i += size;
    }
    return out;
  }

  // One group of up to three words, exercised in rounds rather than one word
  // at a time: every word gets its first exercise, then every word its
  // second, and so on — with the pairs after the first round and the site
  // message at the end. Between two exercises on the same word there are
  // others, so each answer has to be recalled, not just repeated.
  function buildGroup(group, words, progress) {
    const plans = group.map((w) => plan(boxOf(progress, w)));
    const counts = new Map(group.map((w) => [idOf(w), 0]));
    const queue = [];
    const rounds = Math.max(...plans.map((p) => p.length));
    let pairsPlaced = false;
    for (let r = 0; r < rounds; r++) {
      let items = shuffle(group.map((w, i) => ({ w, kind: plans[i][r] })).filter((x) => x.kind));
      const last = queue[queue.length - 1];
      if (last && items.length > 1 && last.word === items[0].w) items.push(items.shift());
      const isIntroRound = items.every((x) => x.kind === "intro");
      for (const x of items) { queue.push(make(x.kind, x.w, words, false, group)); counts.set(idOf(x.w), counts.get(idOf(x.w)) + 1); }
      if (!isIntroRound && !pairsPlaced && group.length >= 2) {
        queue.push(makePairs(group));
        for (const w of group) counts.set(idOf(w), counts.get(idOf(w)) + 1);
        pairsPlaced = true;
      }
    }
    const situation = group.length >= 2 ? makeSituation(group) : null;
    if (situation) {
      queue.push(situation);
      for (const w of situation.group) counts.set(idOf(w), counts.get(idOf(w)) + 1);
    }
    return { queue, counts };
  }

  function buildSession(words, progress, opts = {}) {
    let fresh = [], reviews = [];
    if (opts.only) {
      fresh = [opts.only];
    } else {
      if (!opts.extraNew) {
        reviews = dueWords(words, progress)
          .sort((a, b) => dueOf(progress, a) - dueOf(progress, b))
          .slice(0, MAX_REVIEWS);
      }
      fresh = newWords(words, progress).slice(0, NEW_PER_SESSION);
    }
    const queue = [];
    const remaining = {};
    // Reviews first, then the new words, cut into even groups — so a word
    // due for review is trained next to new ones rather than on its own.
    for (const group of balancedGroups([...reviews, ...fresh])) {
      const built = buildGroup(group, words, progress);
      queue.push(...built.queue);
      for (const [id, n] of built.counts) remaining[id] = n;
    }
    return { queue, pos: 0, remaining, failed: new Set(), total: fresh.length + reviews.length, clean: 0 };
  }

  // A finished block moves the word between boxes.
  function score(current, failed, day = today()) {
    const p = { box: (current && current.box) || 0, due: (current && current.due) || 0, t: Date.now() };
    if (failed) {
      p.box = Math.max(1, p.box - 1);
      p.due = day + 1;
    } else {
      p.box = Math.min(INTERVALS.length - 1, p.box + 1);
      p.due = day + INTERVALS[p.box];
    }
    return p;
  }

  // Two copies of the progress (this device and the shared file): for each
  // word keep the one changed last.
  function merge(a, b) {
    const out = Object.assign({}, a || {});
    for (const [id, p] of Object.entries(b || {})) {
      const mine = out[id];
      if (!mine || (p.t || 0) > (mine.t || 0)) out[id] = p;
    }
    return out;
  }

  // The few words to keep in front of the eyes — the same ones the next
  // training will bring: due first, then the next new ones, then words being
  // learnt. The Mac's Cyclop picks them the same way.
  // Words waiting for review never take over the whole set: one place is
  // kept for the next new word, and the waiting ones take turns in the rest
  // (`slot` moves every hour and a half), so skipping a few days does not
  // freeze the same three words on the screen.
  function focusSet(words, progress, n = 3, day = today(), slot = 0) {
    const due = dueWords(words, progress, day).sort((a, b) => dueOf(progress, a) - dueOf(progress, b));
    const fresh = newWords(words, progress);
    const learning = words
      .filter((w) => { const b = boxOf(progress, w); return b >= 1 && b <= 4 && dueOf(progress, w) > day; })
      .sort((a, b) => dueOf(progress, a) - dueOf(progress, b));
    const dueSlots = Math.min(due.length, fresh.length ? n - 1 : n);
    const start = due.length ? slot % due.length : 0;
    const rotated = due.slice(start).concat(due.slice(0, start)).slice(0, dueSlots);
    const out = [];
    for (const w of [...rotated, ...fresh, ...due, ...learning]) {
      if (!out.includes(w)) out.push(w);
      if (out.length === n) break;
    }
    if (!out.length && words.length) out.push(words[day % words.length]);
    return out;
  }

  // The word to keep in front of the eyes: due today first, then words being
  // learnt (rotating through the day), then the next new one.
  function focusWord(words, progress, now = new Date()) {
    const day = today(now);
    const due = dueWords(words, progress, day).sort((a, b) => dueOf(progress, a) - dueOf(progress, b));
    const learning = words.filter((w) => { const b = boxOf(progress, w); return b >= 1 && b <= 4; });
    const fresh = newWords(words, progress);
    const slot = Math.floor(now.getHours() / 3);
    if (due.length) return { word: due[slot % due.length], reason: "due", due: due.length };
    if (learning.length) return { word: learning[(day + slot) % learning.length], reason: "learning", due: 0 };
    if (fresh.length) return { word: fresh[0], reason: "new", due: 0 };
    return words.length ? { word: words[(day + slot) % words.length], reason: "known", due: 0 } : null;
  }

  function blank(sentence, word) {
    const i = sentence.toLowerCase().indexOf(word.toLowerCase());
    if (i < 0) return sentence;
    return sentence.slice(0, i) + "_____" + sentence.slice(i + word.length);
  }

  const normalize = (s) => s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9'\- ]/g, "").replace(/\s+/g, " ").trim();

  function distance(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }

  // "exact", "typo" (one slip in a longer word — counted right, spelling shown), or "wrong".
  function checkTyped(input, answer) {
    const a = normalize(input), b = normalize(answer);
    if (!a) return "wrong";
    if (a === b) return "exact";
    if (b.length >= 5 && distance(a, b) === 1) return "typo";
    return "wrong";
  }

  return { INTERVALS, NEW_PER_SESSION, MAX_REVIEWS, idOf, today, shuffle, dueWords, newWords, boxOf, dueOf, plan, make, buildSession, score, merge, focusSet, balancedGroups, focusWord, blank, makePairs, makeSituation, checkTyped, hasExamples };

        <button data-act="tab" data-tab="all" aria-pressed="${state.tab === "all"}">Все слова</button></div>`;
    }
    html += `</header>`;
    if (s && s.pos >= s.queue.length) html += renderSummary();
    else if (s) html += renderExercise();
    else if (state.adding) html += renderAddForm();
    else if (state.browse !== null) html += renderCard();
    else html += state.tab === "today" ? renderToday() : renderList();
    app.innerHTML = html;
    const input = state.session ? app.querySelector("input.typed") : null;
    if (input && state.ex && !state.ex.done) { input.value = state.ex.typed; input.focus({ preventScroll: true }); }
  }

  function renderToday() {
    const due = E.dueWords(WORDS, progress).length;
    const fresh = Math.min(E.NEW_PER_SESSION, E.newWords(WORDS, progress).length);
    const counts = [0, 0, 0, 0, 0, 0, 0];
    for (const w of WORDS) counts[E.boxOf(progress, w)]++;
    const max = Math.max(...counts, 1);
    const date = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
    const total = Math.min(due, E.MAX_REVIEWS) + fresh;
    const slot = Math.floor(Date.now() / 1800000);
    const focus = E.focusSet(WORDS, progress, 3, E.today(), Math.floor(slot / 3));
    const tag = (w) => {
      const b = E.boxOf(progress, w);
      if (b === 0) return "новое";
      return E.dueOf(progress, w) <= E.today() ? "повторить" : "учу";
    };
    const cards = focus.map((w) => {
      const ex = E.hasExamples(w) ? w.examples[slot % w.examples.length] : null;
      return `<article class="sheet now">
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:baseline">
          <span class="word" style="font-size:32px;min-width:0">${esc(w.en)}</span>
          <span class="label" style="flex:none">${tag(w)}</span>
        </div>
        <div class="row">${sayBtn(w.en)}${sayBtn(w.en, "en", true)}${w.ipa ? `<span class="ipa">${esc(w.ipa)}</span>` : ""}</div>
        <div>${esc(w.ru)}</div>
        ${ex ? `<div class="example"><div><div>${esc(ex.en)}</div><div class="sub">${esc(ex.ru)}</div></div>${sayBtn(ex.en)}</div>` : ""}
      </article>`;
    }).join("");
    return `<main>
      <div><div class="label">${esc(date)}</div><h1>Слова сейчас</h1></div>
      <p class="note" style="margin:0">Посмотри и послушай. Потом закрепи тренировкой — в ней будут эти же слова.</p>
      ${cards}
      <section class="sheet" aria-label="Слова по уровням">
        <div class="label">Повторить сегодня: ${Math.min(due, E.MAX_REVIEWS)} · новых: ${fresh} · всего слов ${WORDS.length}</div>
        <div class="levels">${counts.map((c) => `<div class="bar ${c ? "" : "zero"}" style="height:${Math.max(4, (c / max) * 100)}%" title="${c}"></div>`).join("")}</div>
        <div class="levelnames">${counts.map((c, i) => `<span><b>${c}</b><br>${LEVEL_NAMES[i]}</span>`).join("")}</div>
        <p class="note" style="margin:0">Слово без ошибок поднимается на уровень и возвращается позже: через 1, 2, 4, 7, 14, 30 дней. Ошибка опускает его, и оно вернётся завтра и ещё раз в конце тренировки.</p>
      </section>
      <p class="status">${syncState === "icloud" ? "Прогресс сохраняется в iCloud и виден на Mac и в виджете." : syncState === "cloud" ? "Прогресс сохраняется в облаке Claude." : "Прогресс сохраняется на этом устройстве."}</p>
    </main>
    <div class="bar-bottom">
      ${total > 0 ? `<button class="btn primary" data-act="start">Тренировка · ${total} ${plural(total, "слово", "слова", "слов")}</button>`
        : `<button class="btn primary" disabled>На сегодня всё</button>`}
      ${due > 0 && fresh > 0 ? `<button class="btn ghost" data-act="start-new">Только новые</button>` : ""}
      ${total === 0 && E.newWords(WORDS, progress).length ? `<button class="btn ghost" data-act="start-new">Ещё 3 новых</button>` : ""}
    </div>`;
  }

  function renderList() {
    const items = WORDS.map((w, i) => {
      const box = E.boxOf(progress, w);
      return `<button class="listitem" data-act="open" data-i="${i}">
        <div><div class="en">${esc(w.en)} <span class="ipa" style="font-weight:400;font-size:14px">${esc(w.ipa || "")}</span>${w.custom ? ' <span class="status">· моё</span>' : ""}</div><div class="ru">${esc(w.ru)}</div></div>
        <span class="pips" aria-label="Уровень ${box} из 6">${[1, 2, 3, 4, 5, 6].map((l) => `<i class="${l <= box ? "on" : ""}"></i>`).join("")}</span>
      </button>`;
    }).join("");
    return `<main><button class="btn ghost" data-act="add-form" style="width:100%">+ Добавить своё слово</button><div class="list">${items}</div></main>`;
  }

  function renderCard() {
    const w = WORDS[state.browse];
    const box = E.boxOf(progress, w);
    const due = E.dueOf(progress, w);
    const days = due - E.today();
    const when = box === 0 ? "ещё не изучалось" : days <= 0 ? "повторить сегодня" : `следующий повтор через ${days} ${plural(days, "день", "дня", "дней")}`;
    return `<main>
      <div class="exhead"><button class="iconbtn" data-act="close-card" aria-label="Назад к списку">${ICON_CLOSE}</button><span class="label">Уровень ${box} из 6 · ${when}</span></div>
      <section class="sheet">
        <div class="row"><span class="word">${esc(w.en)}</span>${sayBtn(w.en)}${sayBtn(w.en, "en", true)}</div>
        <div class="ipa" style="font-size:18px">${esc(w.ipa || "")}</div>
        <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div style="flex:1;font-size:18px">${esc(w.ru)}</div>${sayBtn(w.ru, "ru")}</div>
      </section>
      ${E.hasExamples(w) ? `<section class="sheet">
        <div class="label">Примеры</div>
        ${w.examples.map((e) => `<div class="example"><div><div>${esc(e.en)}</div><div class="sub">${esc(e.ru)}</div></div>${sayBtn(e.en)}</div>`).join("")}
      </section>` : ""}
      ${w.custom ? `<button class="btn ghost" data-act="delete-word" data-i="${state.browse}">Удалить это слово</button>` : ""}
    </main>
    <div class="bar-bottom"><button class="btn primary" data-act="practise" data-i="${state.browse}">Потренировать это слово</button></div>`;
  }

  function renderExercise() {
    const s = state.session, ex = s.queue[s.pos], st = state.ex, w = ex.word;
    const pct = Math.round((s.pos / s.queue.length) * 100);
    let body = "";

    if (ex.kind === "intro") {
      body = `<section class="sheet">
        <div class="row"><span class="word">${esc(w.en)}</span>${sayBtn(w.en)}${sayBtn(w.en, "en", true)}</div>
        <div class="ipa" style="font-size:18px">${esc(w.ipa)}</div>
        <div style="font-size:18px">${esc(w.ru)}</div>
        ${(w.examples || []).slice(0, 2).map((e) => `<div class="example"><div><div>${esc(e.en)}</div><div class="sub">${esc(e.ru)}</div></div>${sayBtn(e.en)}</div>`).join("")}
      </section>`;
    } else if (["meaning", "listen", "toEnglish", "fillBlank"].includes(ex.kind)) {
      let prompt = "";
      if (ex.kind === "meaning") prompt = `<div class="row"><span class="word">${esc(w.en)}</span>${sayBtn(w.en)}</div><div class="ipa">${esc(w.ipa)}</div>`;
      if (ex.kind === "listen") prompt = `<div class="row">${sayBtn(w.en, "en", false, "Ещё раз")}${sayBtn(w.en, "en", true)}<span class="sub">${st.done ? `<b style="color:var(--ink)">${esc(w.en)}</b> <span class="ipa">${esc(w.ipa)}</span>` : "Нажми, чтобы послушать ещё раз"}</span></div>`;
      if (ex.kind === "toEnglish") prompt = `<div class="prompt">${esc(w.ru)}</div>`;
      if (ex.kind === "fillBlank") {
        const shown = st.done ? esc(ex.example.en) : esc(E.blank(ex.example.en, w.en)).replace("_____", '<span class="gap">&nbsp;</span>');
        prompt = `<div class="prompt">${shown}</div><div class="sub">${esc(ex.example.ru)}</div>`;
      }
      const opts = ex.options.map((o) => {
        let cls = "opt";
        if (st.done) cls += o === ex.answer ? " good" : o === st.picked ? " bad" : " dim";
        return `<button class="${cls}" data-act="pick" data-v="${esc(o)}" ${st.done ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("");
      body = `<section class="sheet">${prompt}</section><div class="options">${opts}</div>`;
    } else if (["letters", "buildSentence", "dictation"].includes(ex.kind)) {
      let prompt = "";
      if (ex.kind === "letters") prompt = `<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="prompt" style="flex:1">${esc(w.ru)}</div>${sayBtn(w.en, "en", false, "Подсказка: послушать")}</div>`;
      if (ex.kind === "buildSentence") prompt = `<div class="prompt">${esc(ex.example.ru)}</div>`;
      if (ex.kind === "dictation") prompt = `<div class="row">${sayBtn(ex.example.en, "en", false, "Ещё раз")}${sayBtn(ex.example.en, "en", true)}<span class="sub">${st.done ? esc(ex.example.ru) : "Послушай и собери, что услышал"}</span></div>`;
      const placed = st.placed.map((i) => ex.pieces[i]);
      let line = "";
      if (ex.kind === "letters") {
        let k = 0;
        line = [...w.en].map((c) => {
          if (c === " ") return `<span class="slot space"></span>`;
          const v = placed[k++];
          return v ? `<span class="slot ${st.revealed ? "revealed" : ""}">${esc(v)}</span>` : `<span class="slot empty">_</span>`;
        }).join("");
      } else {
        line = `<span class="chipline ${st.revealed ? "revealed" : ""}">${esc(placed.join(" ")) || "&nbsp;"}</span>`;
      }
      const tiles = ex.pieces.map((p, i) => {
        const used = st.placed.includes(i);
        return `<button class="tile ${ex.kind === "letters" ? "letter" : ""} ${used ? "used" : ""} ${st.wrong === i ? "wrong" : ""}" data-act="tap" data-i="${i}" ${used || st.done ? "disabled" : ""}>${esc(p)}</button>`;
      }).join("");
      body = `<section class="sheet">${prompt}<div class="answerline" aria-live="polite">${line}</div></section><div class="tiles">${tiles}</div>`;
    } else if (ex.kind === "pairs") {
      const matchedRu = new Set(st.matched.map((en) => ex.group.find((w) => w.en === en).ru));
      const btn = (side, v) => {
        const done = side === "l" ? st.matched.includes(v) : matchedRu.has(v);
        const selected = st.sel && st.sel.side === side && st.sel.v === v;
        const wrong = st.wrongPair && st.wrongPair[side] === v;
        return `<button class="opt pair ${done ? "good" : ""} ${selected ? "sel" : ""} ${wrong ? "bad" : ""}" data-act="pair" data-side="${side}" data-v="${esc(v)}" ${done || st.done ? "disabled" : ""}>${esc(v)}</button>`;
      };
      body = `<p class="note" style="margin:0">Нажми английское слово, потом его перевод.</p>
        <div class="pairs"><div class="col">${ex.left.map((v) => btn("l", v)).join("")}</div><div class="col">${ex.right.map((v) => btn("r", v)).join("")}</div></div>`;
    } else if (ex.kind === "situation") {
      const placed = st.placed.map((i) => ex.pieces[i]);
      const lines = ex.segments.map((seg, k) => {
        const v = placed[k];
        const slot = v ? `<b class="${st.revealed ? "revealed" : ""}">${esc(v)}</b>` : `<span class="gap ${k === placed.length ? "next" : ""}">&nbsp;</span>`;
        return `${esc(seg.before)}${slot}${esc(seg.after)}`;
      }).join(" ");
      const tiles = ex.pieces.map((p, i) => {
        const used = st.placed.includes(i);
        return `<button class="tile ${used ? "used" : ""} ${st.wrong === i ? "wrong" : ""}" data-act="tap" data-i="${i}" ${used || st.done ? "disabled" : ""}>${esc(p)}</button>`;
      }).join("");
      body = `<section class="sheet message">
          <div class="label">Сообщение · ${ex.group.length} ${plural(ex.group.length, "слово", "слова", "слов")}</div>
          <div class="prompt" style="font-size:19px">Hi Mike,<br>${lines}<br>Thanks!</div>
          ${st.done ? `<div class="sub">${esc(ex.example.ru)}</div>` : `<div class="sub">Вставляй слова по порядку, начиная с первого пропуска.</div>`}
        </section><div class="tiles">${tiles}</div>`;
    } else if (ex.kind === "typing") {
      const hint = [...w.en].map((c, i) => (c === " " ? " " : i === 0 ? c : "_")).join("");
      body = `<section class="sheet">
        <div class="prompt">${esc(w.ru)}</div>
        <div class="hint" aria-label="Первая буква и длина слова">${esc(hint)}</div>
        <form data-form="typed"><input class="typed" id="typed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Напиши по-английски" ${st.done ? "disabled" : ""} value="${esc(st.typed)}"></form>
      </section>`;
    }

    let feedback = "";
    if (st.done && isGroupEx(ex)) {
      const good = !st.mistake;
      feedback = `<div class="feedback ${good ? "good" : "bad"}" role="status"><div class="fb-body"><b>${good ? "Верно!" : "Запомни"}</b>
        ${ex.group.map((w) => `<div><span>${esc(w.en)}</span> <span class="ipa">${esc(w.ipa || "")}</span> — ${esc(w.ru)}</div>`).join("")}</div>
        ${ex.kind === "situation" ? sayBtn(ex.example.en) : ""}</div>`;
    } else if (st.done && ex.kind !== "intro") {
      const good = !st.mistake;
      const title = good ? (st.typedResult === "typo" ? "Почти! Одна опечатка" : "Верно!") : "Запомни";
      const audio = ["fillBlank", "buildSentence", "dictation"].includes(ex.kind) ? ex.example.en : w.en;
      feedback = `<div class="feedback ${good ? "good" : "bad"}" role="status"><div class="fb-body"><b>${title}</b>
        <span>${esc(w.en)}</span> <span class="ipa">${esc(w.ipa)}</span> — ${esc(w.ru)}</div>${sayBtn(audio)}</div>`;
    }

    let actions = "";
    if (ex.kind === "intro") actions = `<button class="btn primary" data-act="next">Понятно, к заданиям</button>`;
    else if (st.done) actions = `<button class="btn primary" data-act="next">Дальше</button>`;
    else if (ex.kind === "typing") actions = `<button class="btn ghost" data-act="reveal">Не знаю</button><button class="btn primary" data-act="check">Проверить</button>`;
    else if (ex.kind === "pairs") actions = `<button class="btn ghost" data-act="reveal">Не знаю</button>`;
    else if (ex.target.length) actions = `<button class="btn ghost" data-act="undo" ${st.placed.length ? "" : "disabled"}>Назад</button><button class="btn ghost" data-act="reveal">Не знаю</button>`;
    else actions = `<button class="btn ghost" data-act="reveal">Не знаю</button>`;

    return `<main>
      <div class="exhead"><button class="iconbtn" data-act="quit" aria-label="Закончить тренировку">${ICON_CLOSE}</button>
        <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <span class="status" style="font-variant-numeric:tabular-nums">${s.pos + 1}/${s.queue.length}</span></div>
      <div class="label">${ex.retry ? "Ещё раз · " : ""}${TITLES[ex.kind]}</div>
      ${body}${feedback}
    </main><div class="bar-bottom">${actions}</div>`;
  }

  function renderAddForm() {
    return `<main>
      <div class="exhead"><button class="iconbtn" data-act="close-form" aria-label="Назад">${ICON_CLOSE}</button><span class="label">Своё слово</span></div>
      <form class="sheet" data-form="add" style="gap:14px">
        <label class="field"><span class="label">Слово по-английски</span><input id="f-en" class="typed" style="font-size:20px" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
        <label class="field"><span class="label">Перевод</span><input id="f-ru" class="typed" style="font-size:20px" autocomplete="off" required></label>
        <label class="field"><span class="label">Транскрипция (если знаешь)</span><input id="f-ipa" class="typed" style="font-size:20px" autocomplete="off" autocapitalize="off" placeholder="/ˈbækˌfɪl/"></label>
        <label class="field"><span class="label">Пример по-английски (необязательно)</span><input id="f-ex" class="typed" style="font-size:18px" autocomplete="off" autocapitalize="sentences"></label>
        <label class="field"><span class="label">Перевод примера</span><input id="f-exru" class="typed" style="font-size:18px" autocomplete="off"></label>
        ${state.formError ? `<p class="status" style="color:var(--bad);margin:0">${esc(state.formError)}</p>` : ""}
        <p class="note" style="margin:0">Пример нужен для заданий с предложениями. Без него слово всё равно будет в тренировке: выбор, на слух, сборка из букв и написание. Если хочешь перевод, транскрипцию и примеры автоматически — напиши Claude «добавь слова: …».</p>
      </form>
    </main>
    <div class="bar-bottom"><button class="btn primary" data-act="add-save">Добавить слово</button></div>`;
  }

  function addWord() {
    const v = (id) => (app.querySelector("#" + id).value || "").trim();
    const en = v("f-en"), ru = v("f-ru"), ipa = v("f-ipa"), ex = v("f-ex"), exru = v("f-exru");
    if (!en || !ru) { state.formError = "Нужны слово и перевод."; render(); return; }
    if (WORDS.some((w) => w.en.toLowerCase() === en.toLowerCase())) { state.formError = "Такое слово уже есть в списке."; render(); return; }
    const examples = ex && ex.toLowerCase().includes(en.toLowerCase()) ? [{ en: ex, ru: exru }] : [];
    if (ex && !examples.length) { state.formError = "В примере должно встречаться само слово."; render(); return; }
    custom.push({ en, ru, ipa: ipa && !ipa.startsWith("/") ? "/" + ipa + "/" : ipa, examples, custom: true });
    rebuildWords();
    save();
    state.adding = false; state.formError = ""; state.tab = "all";
    render();
  }

  function renderSummary() {
    const s = state.session;
    const more = E.newWords(WORDS, progress).length > 0;
    return `<main>
      <div><div class="label">Готово</div><h1>Тренировка закончена</h1></div>
      <section class="sheet"><div class="titleblock">
        <div><div class="big">${s.clean}</div><div class="sub">без ошибок</div></div>
        <div><div class="big">${s.total - s.clean}</div><div class="sub">вернутся завтра</div></div>
      </div></section>
    </main>
    <div class="bar-bottom">
      ${more ? `<button class="btn ghost" data-act="start-new">Ещё 3 новых</button>` : ""}
      <button class="btn primary" data-act="finish">Готово</button>
    </div>`;
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  // ---------- Session flow ----------
  function startSession(opts) {
    state.session = E.buildSession(WORDS, progress, opts);
    state.ex = blankEx();
    state.browse = null;
    if (!state.session.queue.length) { state.session = null; render(); return; }
    render();
    autoSpeak();
  }

  function autoSpeak() {
    const s = state.session;
    if (!s || s.pos >= s.queue.length) return;
    const ex = s.queue[s.pos];
    if (ex.kind === "intro" || ex.kind === "listen") speak(ex.word.en);
    if (ex.kind === "dictation") speak(ex.example.en);
  }

  // A mistake belongs to a word: the word of the exercise, or — in the pairs
  // and the message — the word that was missed.
  function markMistake(word) {
    const st = state.ex, ex = state.session.queue[state.session.pos];
    st.mistake = true;
    st.mistakeIds.add(E.idOf(word || ex.word));
  }

  function finishExercise(mistake) {
    const st = state.ex, ex = state.session.queue[state.session.pos];
    if (mistake && !isGroupEx(ex)) markMistake(ex.word);
    st.done = true;
    render();
    if (ex.kind === "pairs") return;
    speak(["fillBlank", "buildSentence", "dictation", "situation"].includes(ex.kind) ? ex.example.en : ex.word.en);
  }

  function pairTap(side, v) {
    const ex = state.session.queue[state.session.pos], st = state.ex;
    if (st.done) return;
    if (!st.sel || st.sel.side === side) {
      st.sel = { side, v };
      if (side === "l") speak(v);
      render();
      return;
    }
    const en = side === "l" ? v : st.sel.v;
    const ru = side === "r" ? v : st.sel.v;
    const word = ex.group.find((w) => w.en === en);
    st.sel = null;
    if (word.ru === ru) {
      st.matched.push(en);
      st.wrongPair = null;
      speak(en);
      if (st.matched.length === ex.group.length) { finishExercise(false); return; }
    } else {
      markMistake(word);
      st.wrongPair = { l: en, r: ru };
      setTimeout(() => { if (state.ex === st) { st.wrongPair = null; render(); } }, 500);
    }
    render();
  }

  function advance() {
    const s = state.session, ex = s.queue[s.pos];
    for (const id of state.ex.mistakeIds) s.failed.add(id);
    const involved = isGroupEx(ex) ? ex.group : [ex.word];
    let changed = false;
    for (const w of involved) {
      const id = E.idOf(w);
      if (ex.retry || s.remaining[id] === undefined) continue;
      s.remaining[id] -= 1;
      if (s.remaining[id] === 0) {
        const failed = s.failed.has(id);
        progress[id] = E.score(progress[id], failed);
        if (failed) s.queue.push(E.make(Math.random() < 0.5 ? "letters" : "toEnglish", w, WORDS, true));
        else s.clean += 1;
        changed = true;
      }
    }
    if (changed) save();
    s.pos += 1;
    state.ex = blankEx();
    render();
    autoSpeak();
  }

  function tap(i) {
    const s = state.session, ex = s.queue[s.pos], st = state.ex;
    if (st.done || st.placed.includes(i)) return;
    if (ex.pieces[i] === ex.target[st.placed.length]) {
      st.placed.push(i);
      st.wrong = null;
      if (st.placed.length === ex.target.length) { finishExercise(false); return; }
    } else {
      const expected = ex.kind === "situation" ? ex.group.find((w) => w.en === ex.target[st.placed.length]) : ex.word;
      markMistake(expected);
      st.wrong = i;
      st.wrongTaps += 1;
      if (st.wrongTaps >= 3) { reveal(); return; }
      setTimeout(() => { if (state.ex === st && st.wrong === i) { st.wrong = null; render(); } }, 450);
    }
    render();
  }

  function reveal() {
    const ex = state.session.queue[state.session.pos], st = state.ex;
    st.revealed = true;
    if (ex.kind === "pairs") {
      for (const w of ex.group) if (!st.matched.includes(w.en)) { markMistake(w); st.matched.push(w.en); }
      st.sel = null;
      finishExercise(false);
      return;
    }
    if (ex.kind === "situation") {
      for (let k = st.placed.length; k < ex.target.length; k++) markMistake(ex.group.find((w) => w.en === ex.target[k]));
    }
    if (ex.target.length) {
      const used = new Set();
      st.placed = ex.target.map((t) => { const i = ex.pieces.findIndex((p, k) => !used.has(k) && p === t); used.add(i); return i; });
    }
    if (ex.kind === "typing") st.typed = ex.answer;
    finishExercise(true);
  }

  function check() {
    const ex = state.session.queue[state.session.pos], st = state.ex;
    const input = app.querySelector("input.typed");
    st.typed = input ? input.value : st.typed;
    if (!st.typed.trim()) return;
    const result = E.checkTyped(st.typed, ex.answer);
    st.typedResult = result;
    finishExercise(result === "wrong");
  }

  // ---------- Events ----------
  app.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === "say") { speak(b.dataset.text, b.dataset.lang === "ru" ? "ru-RU" : "en-US", b.dataset.slow === "1"); return; }
    if (act === "tab") { state.tab = b.dataset.tab; state.browse = null; render(); return; }
    if (act === "start") return startSession({});
    if (act === "start-new") return startSession({ extraNew: true });
    if (act === "open") { state.browse = Number(b.dataset.i); render(); window.scrollTo(0, 0); return; }
    if (act === "close-card") { state.browse = null; render(); return; }
    if (act === "add-form") { state.adding = true; state.formError = ""; render(); window.scrollTo(0, 0); return; }
    if (act === "close-form") { state.adding = false; render(); return; }
    if (act === "add-save") return addWord();
    if (act === "delete-word") {
      const w = WORDS[Number(b.dataset.i)];
      custom = custom.filter((c) => c.en.toLowerCase() !== w.en.toLowerCase());
      delete progress[E.idOf(w)];
      rebuildWords(); save(); state.browse = null; render(); return;
    }
    if (act === "practise") return startSession({ only: WORDS[Number(b.dataset.i)] });
    if (act === "pick") {
      const ex = state.session.queue[state.session.pos];
      state.ex.picked = b.dataset.v;
      return finishExercise(b.dataset.v !== ex.answer);
    }
    if (act === "tap") return tap(Number(b.dataset.i));
    if (act === "pair") return pairTap(b.dataset.side, b.dataset.v);
    if (act === "undo") { state.ex.placed.pop(); render(); return; }
    if (act === "reveal") return reveal();
    if (act === "check") return check();
    if (act === "next") return advance();
    if (act === "quit" || act === "finish") { state.session = null; state.ex = null; render(); return; }
  });
  app.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (ev.target.dataset.form === "add") return addWord();
    if (state.session && !state.ex.done) check();
  });
  app.addEventListener("input", (ev) => { if (ev.target.matches("input.typed") && state.ex) state.ex.typed = ev.target.value; });

  render();
})();
</script>
</body></html>
